
<!DOCTYPE html>
<html lang="en" style="background-color: #1cdfdf;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
    <style>
      #downloadBtn {
        background-color: #007bff;
        color: rgb(0, 0, 0);
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 1rem;
        transition: background-color 0.3s ease;
      }
      #downloadBtn:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body style="color: #000000;">
    <section>
      <div class="card">
        <div class="avatar-container">
          <img
            id="avatarPreview"
            src="./assets/avatar.png"
            alt="Avatar"
            class="avatar"
          />
        </div>

        <div class="descripcion">
          <h2>Descripción del CV</h2>
          <p>Una descripción de mi perfil en base a logros y que hago actualmente.</p>
        </div>

        <div class="contacto">
          <p>📞 321 8667700</p>
        </div>

        <div class="links">
          <a href="education.html" class="link-card">Educación</a>
          <a href="experience.html" class="link-card">Experiencia</a>
        </div>

        <button id="downloadBtn" class="link-card">Descargar CV en PDF</button>
      </div>
    </section>
  </body>
</html>
  
    <section id="hablemos" style="padding: 2rem; background-color: #06a19a;">
      <h2>Hablemos</h2>
      <p>¿Tienes alguna pregunta o quieres ponerte en contacto? ¡Déjame un mensaje!</p>

      <form action="https://formspree.io/f/mkgrovry" method="POST" style="max-width: 500px;">
        <textarea name="message" rows="6" placeholder="Escribe tu mensaje aquí..." required style="width: 100%; padding: 1rem;"></textarea>
        <button type="submit" style="margin-top: 1rem; padding: 0.5rem 1rem;">Enviar</button>
      </form>

      <img src="https://media1.tenor.com/m/MaBDbB3qK50AAAAC/stan-twitter-sabrina-carpenter.gif" alt="Nuevo gif" style="margin-top: 1rem; max-width: 100%; height: auto;">
    </section>

    <script>
      document.getElementById("downloadBtn").addEventListener("click", function () {
        const element = document.body;
        const opt = {
          margin:       0.5,
          filename:     'mi_cv.pdf',
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2 },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        html2pdf().from(element).set(opt).save();
      });
    </script>
  </body>
</html>
